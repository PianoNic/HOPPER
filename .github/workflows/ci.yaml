name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --no-restore -warnaserror

      - run: dotnet test --no-build

  frontend:
    name: Angular build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/HOPPER.Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - run: bun run test

      # ng build warns and still exits 0, so the log decides, not the status.
      - name: Build and reject warnings
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log
          if grep -nE "^(Warning|WARNING)|▲|NG[0-9]{4}|exceeded maximum budget" build.log; then
            echo "::error::The production build emitted warnings."
            exit 1
          fi

  locator:
    name: Locator build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/HOPPER.Locator
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.14.3 will not start on JDK 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew --no-daemon build templates

      - name: Every shipped adapter carries its marker entry
        run: |
          set -eu
          check() {
            if jar tf "build/templates/$1" | grep -qxF "$2"; then
              echo "ok    $1"
            else
              echo "::error::$1 is missing $2"
              exit 1
            fi
          }
          check hopper-forge-1122.jar   ch/pianonic/hopper/HopperCoreMod.class
          check hopper-forge-1165.jar   META-INF/services/net.minecraftforge.forgespi.locating.IModLocator
          check hopper-forge-1182.jar   META-INF/services/net.minecraftforge.forgespi.locating.IModLocator
          check hopper-forge-modern.jar META-INF/services/net.minecraftforge.forgespi.locating.IModLocator
          check hopper-neoforge.jar     META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator
          check hopper-fabric.jar       fabric.mod.json

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/HOPPER.API/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: hopper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: The image carries the locator templates and the dashboard
        run: |
          docker run --rm --entrypoint sh hopper:ci -c '
            missing=0
            for f in /app/locator/hopper-forge-1122.jar \
                     /app/locator/hopper-forge-1165.jar \
                     /app/locator/hopper-forge-1182.jar \
                     /app/locator/hopper-forge-modern.jar \
                     /app/locator/hopper-neoforge.jar \
                     /app/locator/hopper-fabric.jar \
                     /app/wwwroot/index.html \
                     /app/HOPPER.API.dll; do
              if [ -f "$f" ]; then echo "ok      $f"; else echo "MISSING $f"; missing=1; fi
            done
            exit $missing
          ' || { echo "::error::the image is missing files a deployment needs"; exit 1; }
