name: Release

# One pipeline for a published GitHub Release, in order:
#   1. ci           - every gate in ci.yaml, against the tagged tree.
#   2. sync-version - bump application.properties to the release tag, commit it to main.
#   3. docker       - build + push the multi-arch image from the bumped main.
#
# ci comes FIRST, and sync-version needs it. The bump is a push to main, so running it ahead of the
# gates means a release that cannot build still moves main - which is exactly what happened when the
# Dockerfile's locator stage broke: nothing verified the image, and the only signal was a red job
# after the version had already landed.
#
# docker depends on sync-version and checks out main *after* the bump, so the image is built from
# the version-bumped tree. Directory.Build.props reads application.properties, so the version the
# dashboard reports and the version on the tag are the same thing by construction, with no separate
# stamping step and no drift.
#
# Unlike KRINT there is no desktop job: HOPPER ships a container and a client jar, not an installer.
# The client jar is not a release artifact either - it is built into the image by the Dockerfile's
# JDK stage and patched per server at download time, so there is nothing to attach here.

on:
  release:
    types: [published]

jobs:
  # The same gates a pull request gets, reused rather than restated - a second copy would drift, and
  # the copy that drifted would be the one guarding releases.
  ci:
    name: Gates
    uses: ./.github/workflows/ci.yaml

  sync-version:
    name: Bump version to the release tag
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.sync.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure git as the maintainer
        run: |
          git config user.name "PianoNic"
          git config user.email "79938743+PianoNic@users.noreply.github.com"

      - name: Bump application.properties
        id: sync
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          # Tags ship inconsistently cased (e.g. "V1.2.0"); strip any non-digit prefix.
          TAG_VERSION="$(printf '%s' "$TAG_VERSION" | sed -E 's/^[^0-9]*//')"
          FILE_VERSION=$(grep -oP '(?<=<version>)[^<]+' application.properties)
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

          echo "Release tag version: $TAG_VERSION"
          echo "File version:        $FILE_VERSION"

          if [ "$TAG_VERSION" = "$FILE_VERSION" ]; then
            echo "Already in sync, nothing to commit."
            exit 0
          fi

          sed -i "s|<version>$FILE_VERSION</version>|<version>$TAG_VERSION</version>|" application.properties

          # main is not protected on this repo, so the bump goes straight in with the default
          # GITHUB_TOKEN. If main is ever protected, this step is the one that breaks, and the fix
          # is KRINT's approach: land it through an admin-merged PR with a PAT.
          git add application.properties
          git commit -m "Bumped application.properties to $TAG_VERSION for release"
          git push origin main

  docker:
    name: Build and push multi-arch image
    needs: sync-version
    runs-on: ubuntu-latest
    # The heavy stages build once on the runner's native arch (see the Dockerfile's BUILDPLATFORM
    # pins), so this is a minutes-long job. Fail fast if that ever regresses to emulated per-arch
    # builds instead of burning the default 6h ceiling before being cancelled.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # main now carries the version bump from sync-version.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare repository name
        id: prep
        run: |
          echo "repository_lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/HOPPER.API/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ steps.prep.outputs.repository_lowercase }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ steps.prep.outputs.repository_lowercase }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          provenance: false
          sbom: false
