name: Release


on:
  release:
    types: [published]

jobs:
  ci:
    name: Gates
    uses: ./.github/workflows/ci.yaml

  sync-version:
    name: Bump version to the release tag
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.sync.outputs.version }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git as the maintainer
        run: |
          git config user.name "PianoNic"
          git config user.email "79938743+PianoNic@users.noreply.github.com"

      - name: Bump application.properties
        id: sync
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -uo pipefail

          TAG_VERSION="$(printf '%s' "$TAG_NAME" | sed -E 's/^[^0-9]*//')"
          FILE_VERSION=$(grep -oP '(?<=<version>)[^<]+' application.properties)
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

          echo "Release tag version: $TAG_VERSION"
          echo "File version:        $FILE_VERSION"

          # Whatever happens below, the docker job needs a commit to build, so every exit path
          # publishes the SHA that is on main by then.
          publish_head() {
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          }

          if [ "$TAG_VERSION" = "$FILE_VERSION" ]; then
            echo "Already in sync, nothing to commit."
            publish_head
            exit 0
          fi

          sed -i "s|<version>$FILE_VERSION</version>|<version>$TAG_VERSION</version>|" application.properties

          git add application.properties
          if git diff --cached --quiet; then
            echo "::warning::application.properties was not rewritten; leaving main as it is."
            publish_head
            exit 0
          fi

          git commit -m "Bumped application.properties to $TAG_VERSION for release [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              publish_head
              exit 0
            fi
            echo "Push $attempt was rejected; rebasing onto origin/main and trying again."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::The version bump does not rebase onto main cleanly."
              exit 1
            fi
          done

          echo "::error::Could not push the version bump to main."
          exit 1

  docker:
    name: Build and push multi-arch image
    needs: sync-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # The tag itself still carries the previous version, and main moves on, so the image is built
      # from the exact commit sync-version left on main.
      - name: Checkout the commit the version bump landed on
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-version.outputs.sha }}

      - name: Prepare image names
        id: prep
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "repository_lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

          # Docker Hub rejects uppercase repository names, and this repo is called HOPPER. Lowercase
          # both halves rather than using github.event.repository.name verbatim, or the push fails
          # with "repository name must be lowercase" after the whole image has already been built.
          IMAGES="ghcr.io/${GITHUB_REPOSITORY,,}"

          # Only add Docker Hub when it is actually configured. An unset secret would otherwise
          # produce an entry beginning with a slash, which likewise only fails at push time and
          # throws away the entire build.
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            IMAGES="$IMAGES"$'\n'"docker.io/${DOCKERHUB_USERNAME,,}/${GITHUB_REPOSITORY##*/}"
            IMAGES="${IMAGES,,}"
            echo "dockerhub=true" >> $GITHUB_OUTPUT
          else
            echo "dockerhub=false" >> $GITHUB_OUTPUT
            echo "DOCKERHUB_USERNAME is not set; pushing to ghcr only."
          fi

          {
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Not continue-on-error: if Docker Hub is configured but the credentials are wrong, that is a
      # broken release and should say so here, not silently ship to one registry out of two.
      - name: Log in to Docker Hub
        if: steps.prep.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest, {major} and {major}.{minor} must never move backwards, so publishing an older
      # version leaves them pointing at the highest one.
      - name: Decide whether the moving tags may point at this release
        id: moving
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -uo pipefail

          if [ "$PRERELEASE" = "true" ]; then
            echo "$TAG_NAME is a prerelease; leaving the moving tags alone."
            echo "enable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name') || published=""

          highest=$(printf '%s\n' "$published" | sed -E 's/^[^0-9]*//' | grep -E '^[0-9]' | sort -V | tail -n1)
          version="$(printf '%s' "$TAG_NAME" | sed -E 's/^[^0-9]*//')"

          echo "This release:      $version"
          echo "Highest published: ${highest:-<none found>}"

          if [ -n "$highest" ] && [ "$version" = "$highest" ]; then
            echo "enable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$TAG_NAME is not the highest published version; leaving latest, {major} and {major}.{minor} alone."
            echo "enable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.images }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ steps.moving.outputs.enable }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},enable=${{ steps.moving.outputs.enable }}
            type=raw,value=latest,enable=${{ steps.moving.outputs.enable }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/HOPPER.API/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ steps.prep.outputs.repository_lowercase }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ steps.prep.outputs.repository_lowercase }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          provenance: false
          sbom: false
