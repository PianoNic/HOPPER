def hopperVersion = {
    for (def directory = rootDir; directory != null; directory = directory.parentFile) {
        def properties = new File(directory, 'application.properties')

        if (properties.isFile()) {
            def matcher = properties.text =~ /<version>([^<]+)<\/version>/

            if (matcher) {
                return matcher[0][1]
            }
        }
    }

    throw new GradleException('No application.properties with a <version> above ' + rootDir +
            '. The jars would claim a version HOPPER never released.')
}()

subprojects {
    apply plugin: 'java-library'

    group = 'ch.pianonic'
    version = hopperVersion

    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.quiltmc.org/repository/release/' }

        maven { url = 'https://libraries.minecraft.net/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'

        options.compilerArgs << '-Xlint:all,-options,-path' << '-Werror'
    }

    tasks.withType(Jar).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    def descriptors = ['fabric.mod.json', 'quilt.mod.json', 'mcmod.info',
                       'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']

    tasks.withType(ProcessResources).configureEach {
        inputs.property('version', project.version)

        filesMatching(descriptors) {
            filter(org.apache.tools.ant.filters.ReplaceTokens,
                    tokens: [version: project.version.toString()])
        }

        doLast {
            destinationDir.eachFileRecurse { resource ->
                if (resource.isFile() && resource.text.contains('@version@')) {
                    throw new GradleException(resource.name + ' still carries @version@ after ' +
                            'processing. Add it to the descriptors list above.')
                }
            }
        }
    }
}

configure(subprojects.findAll { it.name != 'hopper-core' }) {
    evaluationDependsOn(':hopper-core')

    dependencies {
        compileOnly project(':hopper-core')
        testImplementation project(':hopper-core')
    }

    tasks.named('jar', Jar) {
        from project(':hopper-core').sourceSets.main.output

        manifest.attributes(
                'Implementation-Title': 'HOPPER',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'PianoNic',
                'Specification-Title': 'HOPPER',
                'Specification-Version': project.version,
                'Specification-Vendor': 'PianoNic',
        )
    }
}

def shippedTemplates = [
        'hopper-forge-1122'  : 'hopper-forge-1122.jar',
        'hopper-forge-1165'  : 'hopper-forge-1165.jar',
        'hopper-forge-1182'  : 'hopper-forge-1182.jar',
        'hopper-forge-modern': 'hopper-forge-modern.jar',
        'hopper-neoforge'    : 'hopper-neoforge.jar',
        'hopper-fabric'      : 'hopper-fabric.jar',
        'hopper-quilt'       : 'hopper-quilt-plugin.jar',
]

tasks.register('templates', Copy) {
    group = 'build'
    description = 'Collects the shipped adapter jars into build/templates under unversioned names.'

    into layout.buildDirectory.dir('templates')

    shippedTemplates.each { module, fileName ->

        from(project(":$module").tasks.named('jar')) {
            rename '.*\\.jar', fileName
        }
    }
}

// A digest of the sources these jars were built from, so the API can say the templates on disk are
// not the ones this checkout would produce. Content, not timestamps: gradle is content-based and
// would rightly do nothing for a touched file, leaving a warning that nothing could clear.
// LocatorSourceDigest.cs recomputes this exact scheme, so the two must change together.
//
// Never up to date, and finalizes `templates` rather than living inside it: a comment-only edit
// moves the digest without changing a single jar, so the copy is skipped and only an unconditional
// stamp keeps `./gradlew templates` able to clear the warning it caused.
def templatesStamp = tasks.register('templatesStamp') {
    outputs.upToDateWhen { false }

    doLast {
        def files = fileTree(projectDir) {
            include '**/*.java'
            exclude '**/build/**'
        }.files.sort { it.absolutePath }

        def digest = java.security.MessageDigest.getInstance('SHA-256')

        files.each { file ->
            def relative = projectDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            digest.update((relative + '\n').getBytes('UTF-8'))
            digest.update(file.bytes)
        }

        layout.buildDirectory.file('templates/templates.stamp').get().asFile.text =
                digest.digest().encodeHex().toString()
    }
}

tasks.named('templates') {
    finalizedBy templatesStamp
}
