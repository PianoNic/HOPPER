// Forge 1.14.4 through 1.16.5. An IModLocator, but NOT the modern one: at forgespi 3.2.0 and
// below the interface has no IModProvider supertype, scanMods() returns List<IModFile>, and
// findPath / findManifest are abstract. HopperLocator from hopper-forge-modern cannot be reused
// here - same delegate pattern, different method set.
//
// 1.13.2 is out of reach: it ships forgespi 0.13.0, which has no IModLocator class at all.
//
// The ceiling is 1.16.5 and stays there. 1.17.1 ships forgespi 4.0.9, which DELETED findPath and
// findManifest, so HopperLocator1165 does not compile against it - that generation is
// hopper-forge-1182.
//
// 8: Minecraft 1.16.5 and older run on Java 8, which is the reason the core is at 8 too.
tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

// The floor is the default, so an ordinary build is the one that proves the floor still holds.
// Re-prove the 1.16.5 ceiling with:
//   ./gradlew :hopper-forge-1165:compileJava --rerun-tasks \
//       -Pforgespi1165Version=3.2.0 -Pmodlauncher1165Version=8.1.3
//
// A bare version rather than a whole GAV, unlike hopper-forge-modern: modlauncher only moved from
// cpw.mods to net.minecraftforge at 10.1.1, long after this range ended, so every version reachable
// from here is cpw.mods.
def forgespiVersion = findProperty('forgespi1165Version') ?: '1.5.0'
def modlauncherVersion = findProperty('modlauncher1165Version') ?: '8.1.3'

dependencies {
    // The OLDEST forgespi in the claimed range, so the compiler enforces the floor. 1.14.4 ships
    // 1.5.0, 1.15.2 ships 3.0.0, 1.16.5 ships 3.2.0 - and 3.2.0 only ADDS the findManifestAndSigners
    // default, so code written against 1.5.0 satisfies all three.
    //
    // Environment.Keys at 1.5.0 is DIST, MODFOLDERFACTORY, MODDIRECTORYFACTORY, PROGRESSMESSAGE.
    // MODFILEFACTORY does not exist yet - do not touch that key.
    compileOnly "net.minecraftforge:forgespi:${forgespiVersion}"
    // 8.1.3 is what 1.16.5 ships, and the one signature this module touches -
    // Launcher.INSTANCE.environment().getProperty(TypesafeMap$Key) - is byte-identical in
    // modlauncher 4.1.0, 5.1.0, 8.0.9 and 8.1.3, so the whole 1.14.4-1.16.5 range is covered by
    // compiling against any one of them.
    compileOnly "cpw.mods:modlauncher:${modlauncherVersion}"
    compileOnly 'org.apache.logging.log4j:log4j-api:2.15.0'

    // All compileOnly: every one of these is already on the classpath when the locator runs. No
    // ForgeGradle and no reobf - a locator never touches a Minecraft class, so there is nothing
    // to remap.
}

// Manifest: nothing beyond Implementation-Version. Automatic-Module-Name is pointless here -
// LocatorClassLoader is a flat URLClassLoader with no module layer. No mods.toml and no
// FMLModType either: ModsFolderLocator consults ModDirTransformerDiscoverer.allExcluded(), so the
// locator jar is never offered to ModValidator as a mod.
//
// Declaration file: src/main/resources/META-INF/services/net.minecraftforge.forgespi.locating.IModLocator
