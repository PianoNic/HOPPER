<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HOPPER</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1220" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Self-contained on purpose: this block has to render when nothing else did, so it leans on
         neither styles.css nor the build's font stack. -->
    <style>
      #bootstrap-failure[hidden] {
        display: none;
      }

      #bootstrap-failure {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        background: #ffffff;
        color: #0b1220;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      }

      #bootstrap-failure h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }

      #bootstrap-failure-detail {
        margin: 0;
        max-width: 32rem;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #4b5563;
      }

      #bootstrap-failure-retry {
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        background: #0b1220;
        color: #ffffff;
        font: inherit;
        font-size: 0.875rem;
        cursor: pointer;
      }

      @media (prefers-color-scheme: dark) {
        #bootstrap-failure {
          background: #0b1220;
          color: #f3f4f6;
        }

        #bootstrap-failure-detail {
          color: #9ca3af;
        }

        #bootstrap-failure-retry {
          border-color: #374151;
          background: #f3f4f6;
          color: #0b1220;
        }
      }
    </style>
  </head>
  <body>
    <!-- The one failure surface in HOPPER that is not a toast. hlm-toaster is mounted inside the
         routed shell, so when the bootstrap itself fails there is no toaster, no router and no
         Angular to fire one. Unhidden from app/shared/auth/bootstrap-failure.ts. -->
    <div id="bootstrap-failure" hidden>
      <h1>HOPPER could not start</h1>
      <p id="bootstrap-failure-detail"></p>
      <button id="bootstrap-failure-retry" type="button">Try again</button>
    </div>
    <app-root></app-root>
  </body>
</html>
